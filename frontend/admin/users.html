<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users — AsiaSLleek</title><link rel="stylesheet" href="../css/main.css"></head><body><header class="site"></header><main><h1>Users &amp; creators</h1><p><a href="index.html">Back to dashboard</a></p><p class="muted">Only super administrators can change staff roles. Private verification records are never shown here.</p><table class="table"><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th></tr></thead><tbody id="u"></tbody></table></main><footer class="site"></footer><script src="../js/app.js"></script><script>
async function main(){try{const us=await api('/api/admin/users');document.getElementById('u').innerHTML=us.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.username)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td></tr>').join('');}catch(e){document.getElementById('u').innerHTML='<tr><td colspan="4">Admin access required.</td></tr>'}}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
