<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Content queue — AsiaSLleek</title><link rel="stylesheet" href="../css/main.css"></head><body><header class="site"></header><main><h1>Content review queue</h1><p><a href="index.html">Back to dashboard</a></p><p class="muted">Every upload stays private until approved. A written reason is required to reject or remove.</p><div id="q"></div></main><footer class="site"></footer><script src="../js/app.js"></script><script>
async function main(){try{const items=await api('/api/admin/queue');document.getElementById('q').innerHTML=items.map(v=>'<div class="panel"><h2>'+esc(v.title)+'</h2><p>'+esc(v.description||'')+'</p><p><button data-id="'+v.id+'" data-a="approve">Approve</button> <button data-id="'+v.id+'" data-a="request-changes">Request changes</button> <button data-id="'+v.id+'" data-a="reject">Reject</button> <button data-id="'+v.id+'" data-a="remove">Remove</button></p></div>').join('')||'<p>No pending videos.</p>';document.querySelectorAll('#q button').forEach(b=>b.onclick=async()=>{const reason=b.dataset.a==='approve'?'Approved':prompt('Reason (required):','');if(reason===null)return;try{await api('/api/admin/videos/'+b.dataset.id+'/moderate',{method:'POST',body:JSON.stringify({action:b.dataset.a,reason})});location.reload()}catch(e){alert('Failed: '+e.message)}});}catch(e){document.getElementById('q').innerHTML='<p class="notice">Admin access required. Sign in as a moderator or administrator.</p>'}}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
