<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings — AsiaSLleek</title><link rel="stylesheet" href="../css/main.css"></head><body><header class="site"></header><main><h1>Site settings</h1><p><a href="index.html">Back to dashboard</a></p><div id="s" class="panel">Loading…</div><form id="cf" class="form panel"><label for="ck">Category slug</label><input id="ck" required><label for="cn">Category name</label><input id="cn" required><label for="cd">Description</label><input id="cd"><p><button type="submit">Create category</button></p><p id="cm" class="muted"></p></form></main><footer class="site"></footer><script src="../js/app.js"></script><script>
async function main(){try{const s=await api('/api/admin/settings');document.getElementById('s').innerHTML=Object.entries(s).map(([k,v])=>'<p><strong>'+esc(k)+':</strong> '+esc(v)+'</p>').join('');}catch(e){document.getElementById('s').innerHTML='<p class="notice">Admin access required.</p>'}}
document.getElementById('cf').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/categories',{method:'POST',body:JSON.stringify({slug:document.getElementById('ck').value,name:document.getElementById('cn').value,description:document.getElementById('cd').value})});document.getElementById('cm').textContent='Category created.'}catch(err){document.getElementById('cm').textContent='Failed: '+err.message}});
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
