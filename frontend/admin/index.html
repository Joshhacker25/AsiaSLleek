<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard — AsiaSLleek</title><link rel="stylesheet" href="../css/main.css"></head><body><header class="site"></header><main><h1>Admin dashboard</h1><p class="muted">Backend-enforced permissions: moderator, support, administrator, super administrator. Sign in with a staff account (demo_moderator / demo_admin, password DemoPass123!).</p><nav><a href="index.html">Dashboard</a> | <a href="content.html">Content queue</a> | <a href="reports.html">Reports</a> | <a href="users.html">Users</a> | <a href="settings.html">Settings</a></nav><div id="dash" class="panel">Loading…</div><h2>Audit log (latest)</h2><table class="table"><thead><tr><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody id="audit"></tbody></table></main><footer class="site"></footer><script src="../js/app.js"></script><script>
async function main(){try{const d=await api('/api/admin/dashboard');document.getElementById('dash').innerHTML='<p>Pending reviews: <strong>'+d.pending_reviews+'</strong></p><p>Open reports: <strong>'+d.open_reports+'</strong></p><p>Removal requests: <strong>'+d.removal_requests+'</strong></p><p>Open appeals: <strong>'+d.open_appeals+'</strong></p><p>Total users: <strong>'+d.total_users+'</strong></p><p>Total videos: <strong>'+d.total_videos+'</strong></p>';const a=await api('/api/admin/audit-log');document.getElementById('audit').innerHTML=a.slice(0,20).map(x=>'<tr><td>'+x.actor_id+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.target_type)+' '+(x.target_id||'')+'</td><td>'+esc(x.detail||'')+'</td></tr>').join('')||'<tr><td colspan="4">No audit entries yet.</td></tr>';}catch(e){document.getElementById('dash').innerHTML='<p class="notice">Admin access required. Sign in as a moderator or administrator.</p>';}}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
