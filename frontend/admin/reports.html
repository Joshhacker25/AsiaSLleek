<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reports — AsiaSLleek</title><link rel="stylesheet" href="../css/main.css"></head><body><header class="site"></header><main><h1>Report &amp; takedown queue</h1><p><a href="index.html">Back to dashboard</a></p><div id="r"></div><h2>Appeals</h2><div id="a"></div></main><footer class="site"></footer><script src="../js/app.js"></script><script>
async function main(){try{const reps=await api('/api/admin/reports');document.getElementById('r').innerHTML=reps.map(x=>'<div class="panel"><p><strong>Report '+x.id+'</strong> — video '+x.video_id+' — '+esc(x.reason)+' ('+esc(x.status)+', '+esc(x.priority)+')</p><p>'+esc(x.details||'')+'</p><p><button data-id="'+x.id+'" data-s="resolved">Resolve</button> <button data-id="'+x.id+'" data-s="dismissed">Dismiss</button></p></div>').join('')||'<p>No reports.</p>';document.querySelectorAll('#r button').forEach(b=>b.onclick=async()=>{const reason=prompt('Decision reason:','');if(reason===null)return;await api('/api/admin/reports/'+b.dataset.id,{method:'POST',body:JSON.stringify({status:b.dataset.s,decision_reason:reason})});location.reload()});const aps=await api('/api/admin/appeals');document.getElementById('a').innerHTML=aps.map(x=>'<div class="panel"><p>Appeal '+x.id+' — video '+x.video_id+' — '+esc(x.status)+'</p><p>'+esc(x.statement)+'</p><p><button data-id="'+x.id+'" data-s="upheld">Uphold</button> <button data-id="'+x.id+'" data-s="overturned">Overturn</button></p></div>').join('')||'<p>No appeals.</p>';document.querySelectorAll('#a button').forEach(b=>b.onclick=async()=>{await api('/api/admin/appeals/'+b.dataset.id,{method:'POST',body:JSON.stringify({status:b.dataset.s})});location.reload()});}catch(e){document.getElementById('r').innerHTML='<p class="notice">Admin access required.</p>' }}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
