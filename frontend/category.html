<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Category — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1 id="ct">Category</h1><p id="cd" class="muted"></p><form id="cf" class="panel"><label for="cs">Sort by</label><select id="cs" name="sort"><option value="recent">Most recent</option><option value="popular">Most viewed</option></select><button type="submit">Sort</button></form><div id="grid" class="grid"></div><p class="muted">Page 1 — pagination: use the API limit/page parameters for more pages.</p></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){const p=new URLSearchParams(location.search);const slug=p.get('slug')||'';const c=await api('/api/categories/'+slug).catch(()=>null);if(c){document.getElementById('ct').textContent=c.name;document.getElementById('cd').textContent=c.description||'';document.title=c.name+' — AsiaSLleek';}document.getElementById('cs').value=p.get('sort')||'recent';const v=await loadVideos({category:slug,sort:p.get('sort')||'recent'});document.getElementById('grid').innerHTML=v.map(videoCard).join('')||'<p>No videos in this category yet.</p>';}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
