<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>Create an account</h1><p class="muted">Adults only. You must be 18 or older. Age assurance is not configured in this build.</p><form id="rf" class="form panel"><label for="ru">Username</label><input id="ru" required minlength="3"><label for="re">Email</label><input id="re" type="email" required><label for="rp">Password (8+ characters)</label><input id="rp" type="password" required minlength="8"><p><button type="submit">Register</button></p><p id="err" class="muted"></p></form></main><footer class="site"></footer><script src="js/app.js"></script><script>
document.getElementById('rf').addEventListener('submit',async e=>{e.preventDefault();try{const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:document.getElementById('ru').value,email:document.getElementById('re').value,password:document.getElementById('rp').value})});localStorage.setItem('asiaslleek_token',r.access_token);location.href='account.html';}catch(err){document.getElementById('err').textContent='Registration failed: '+err.message}});
</script></body></html>
