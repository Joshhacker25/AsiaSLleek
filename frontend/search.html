<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>Search</h1><form id="sf" class="panel"><label for="sq">Keywords</label><input id="sq" name="q"><label for="sc">Category</label><select id="sc" name="category"><option value="">All categories</option></select><label for="ss">Sort by</label><select id="ss" name="sort"><option value="recent">Most recent</option><option value="popular">Most viewed</option></select><p><button type="submit">Search</button></p></form><div id="results" class="grid"></div><p id="count" class="muted"></p></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){const p=new URLSearchParams(location.search);document.getElementById('sq').value=p.get('q')||'';const cats=await api('/api/categories').catch(()=>[]);const sel=document.getElementById('sc');cats.forEach(c=>{const o=document.createElement('option');o.value=c.slug;o.textContent=c.name;sel.appendChild(o)});sel.value=p.get('category')||'';document.getElementById('ss').value=p.get('sort')||'recent';const v=await loadVideos({q:p.get('q')||'',category:p.get('category')||'',sort:p.get('sort')||'recent'});document.getElementById('results').innerHTML=v.map(videoCard).join('')||'<p>No results.</p>';document.getElementById('count').textContent=v.length+' result(s)';}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
