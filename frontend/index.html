<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AsiaSLleek — Home</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>AsiaSLleek</h1><p class="muted">A fictional adults-only video catalogue. All entries are fictional placeholders.</p><div class="notice">Age assurance is <strong>not configured</strong> in this build. Do not use for real content without an age-assurance provider, moderation, and legal review.</div><h2>Categories</h2><div id="cats"></div><h2>Featured</h2><div id="featured" class="grid"></div><h2>Recent</h2><div id="recent" class="grid"></div><h2>Popular</h2><div id="popular" class="grid"></div></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){const cats=await api('/api/categories').catch(()=>[]);document.getElementById('cats').innerHTML=cats.map(c=>'<a class="pill" href="category.html?slug='+c.slug+'">'+esc(c.name)+'</a>').join('');const v=await loadVideos();document.getElementById('featured').innerHTML=v.filter(x=>x.is_featured).map(videoCard).join('')||'<p class="muted">No featured videos yet.</p>';document.getElementById('recent').innerHTML=v.slice(0,6).map(videoCard).join('');document.getElementById('popular').innerHTML=[...v].sort((a,b)=>b.views-a.views).slice(0,6).map(videoCard).join('');}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
