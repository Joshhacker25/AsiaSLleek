<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>Account &amp; privacy</h1><div id="me" class="panel">Sign in to view your account.</div><form id="af" class="form panel"><label for="ae">Email</label><input id="ae" type="email"><label><input type="checkbox" id="ah" style="width:auto"> Keep my watch history private (history is never shared with other users)</label><p><button type="submit">Save settings</button></p></form><p><a href="help.html#removal">Request removal of content</a> &middot; <a href="help.html">Help</a></p></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){if(!token())return;try{const u=await api('/api/auth/me');document.getElementById('me').innerHTML='<p>Username: '+esc(u.username)+'</p><p>Email: '+esc(u.email)+'</p><p>Role: '+esc(u.role)+'</p>';document.getElementById('ae').value=u.email;}catch(e){}}
document.getElementById('af').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/auth/me',{method:'PUT',body:JSON.stringify({email:document.getElementById('ae').value})});alert('Saved.')}catch(err){alert('Sign in first.')}});
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
