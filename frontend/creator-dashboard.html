<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Creator dashboard — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>Creator dashboard</h1><section class="panel"><h2>Edit profile</h2><form id="cpf" class="form"><label for="cd2">Display name</label><input id="cd2" required><label for="cb">Bio</label><textarea id="cb"></textarea><p><button type="submit">Save profile</button></p><p id="cm" class="muted"></p></form></section><section class="panel"><h2>Submit a video</h2><p class="muted">Uploads stay private until a moderator approves them. You must confirm every person shown is an adult, consented to recording and distribution, and you hold the rights. Mock upload in local dev — no real media is stored.</p><form id="sf2" class="form"><label for="vt">Title</label><input id="vt" required><label for="vd2">Description</label><textarea id="vd2"></textarea><label for="vl">Language</label><select id="vl"><option value="en">English</option><option value="hi">Hindi</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="zh">Chinese</option><option value="other">Other</option></select><label for="vc">Category</label><select id="vc"></select><label for="vg">Tags (comma separated)</label><input id="vg"><label><input type="checkbox" id="c1" style="width:auto"> Every person shown is an adult</label><label><input type="checkbox" id="c2" style="width:auto"> Everyone shown consented to recording and distribution</label><label><input type="checkbox" id="c3" style="width:auto"> I hold the rights to this content</label><p><button type="submit">Submit for review</button></p><p id="sm" class="muted"></p></form></section><section class="panel"><h2>Your submissions</h2><div id="subs"></div></section></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){const cats=await api('/api/categories').catch(()=>[]);const sel=document.getElementById('vc');cats.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o)});if(!token()){document.getElementById('subs').innerHTML='<p>Sign in as a creator to see submissions.</p>';return}try{const subs=await api('/api/my-submissions');document.getElementById('subs').innerHTML=subs.map(s=>'<p>'+esc(s.title)+' — <strong>'+esc(s.status)+'</strong> '+(s.moderator_feedback?'— '+esc(s.moderator_feedback):'')+(s.status==='rejected'?' <button data-id="'+s.id+'" class="resub">Resubmit</button>':'')+'</p>').join('')||'<p>No submissions yet.</p>';document.querySelectorAll('.resub').forEach(b=>b.onclick=async()=>{await api('/api/videos/'+b.dataset.id+'/resubmit',{method:'POST',body:'{}'});location.reload()});}catch(e){document.getElementById('subs').textContent='Could not load submissions: '+e.message}}
document.getElementById('cpf').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/auth/creator-profile',{method:'POST',body:JSON.stringify({display_name:document.getElementById('cd2').value,bio:document.getElementById('cb').value})});document.getElementById('cm').textContent='Profile saved.'}catch(err){document.getElementById('cm').textContent='Failed: '+err.message}});
document.getElementById('sf2').addEventListener('submit',async e=>{e.preventDefault();if(!(document.getElementById('c1').checked&&document.getElementById('c2').checked&&document.getElementById('c3').checked)){document.getElementById('sm').textContent='All three confirmations are required.';return}try{await api('/api/videos',{method:'POST',body:JSON.stringify({title:document.getElementById('vt').value,description:document.getElementById('vd2').value,language:document.getElementById('vl').value,category_id:+document.getElementById('vc').value,tags:document.getElementById('vg').value,confirmed_all_adults:true,confirmed_consent:true,confirmed_rights:true})});document.getElementById('sm').textContent='Submitted. It stays private until a moderator approves it.';location.reload()}catch(err){document.getElementById('sm').textContent='Failed: '+err.message}});
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
