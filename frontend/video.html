<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Video — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><div id="vd"></div><div id="related" class="grid"></div></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){const id=new URLSearchParams(location.search).get('id');let v=null;try{v=await api('/api/videos/'+id)}catch(e){v=FIXTURES.find(x=>x.id==id)}if(!v){document.getElementById('vd').innerHTML='<p>Video not found.</p>';return}document.title=v.title+' — AsiaSLleek';document.getElementById('vd').innerHTML='<div class="player" role="img" aria-label="Neutral placeholder for the video player"><div><p><strong>Neutral placeholder</strong></p><p>'+esc(v.title)+'</p><p class="small">No real video file — fictional placeholder only.</p></div></div><h1>'+esc(v.title)+'</h1><p class="muted">By <a href="creator.html?id='+(v.creator_id||'')+'">'+esc(v.creator_name||'Unknown creator')+'</a> &middot; '+fmtDur(v.duration_seconds)+' &middot; '+(v.views||0).toLocaleString()+' views</p><p>'+esc(v.description||'')+'</p><p>Category: <a href="category.html?slug='+esc(v.category_slug||'')+'">'+esc(v.category_slug||'')+'</a></p><p>'+(v.tags||'').split(',').map(t=>'<span class="pill">'+esc(t.trim())+'</span>').join('')+'</p><p><button id="save" class="btn secondary">Save to playlist</button> <button id="rep" class="btn danger">Report this video</button></p><div id="msg" class="notice" hidden></div>';document.getElementById('save').onclick=async()=>{if(!token()){location.href='login.html';return}try{const pls=await api('/api/library');const m=document.getElementById('msg');m.hidden=false;m.textContent='Saved. Use Library to manage playlists (create one first if needed).';}catch(e){alert('Sign in to save.')}};document.getElementById('rep').onclick=async()=>{const reason=prompt('Report reason (e.g. non-consensual, underage, stolen):','');if(!reason)return;if(!token()){location.href='login.html';return}try{await api('/api/reports',{method:'POST',body:JSON.stringify({video_id:+id,reason,details:''})});alert('Report submitted. A moderator will review it.')}catch(e){alert('Could not submit the report: '+e.message)}};const rel=v.related||FIXTURES.filter(x=>x.id!=v.id);document.getElementById('related').innerHTML='<h2>Related videos</h2>'+rel.map(videoCard).join('');}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
