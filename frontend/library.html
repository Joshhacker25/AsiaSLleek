<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>Your library</h1><p id="need" class="notice">Sign in to see your watch history, saved videos and playlists.</p><h2>Watch history</h2><div id="hist" class="grid"></div><h2>Playlists</h2><div id="pls"></div><form id="pf" class="panel"><label for="pn">New playlist name</label><input id="pn" required><button type="submit">Create playlist</button></form></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){if(!token())return;document.getElementById('need').hidden=true;try{const lib=await api('/api/library');document.getElementById('pls').innerHTML=lib.playlists.map(p=>'<p>'+esc(p.name)+'</p>').join('')||'<p>No playlists yet.</p>';const ids=lib.history.map(h=>h.video_id);const vids=FIXTURES.filter(v=>ids.includes(v.id));document.getElementById('hist').innerHTML=vids.map(videoCard).join('')||'<p>No watch history yet.</p>';}catch(e){document.getElementById('need').hidden=false}}
document.getElementById('pf').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/playlists',{method:'POST',body:JSON.stringify({name:document.getElementById('pn').value})});location.reload()}catch(err){alert('Sign in to create a playlist.')}});
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
