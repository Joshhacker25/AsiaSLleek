<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><h1>Sign in</h1><form id="lf" class="form panel"><label for="lu">Username</label><input id="lu" required autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" required autocomplete="current-password"><p><button type="submit">Sign in</button></p><p id="err" class="muted"></p><p class="small">Fictional dev accounts: demo_viewer / demo_creator / demo_moderator / demo_admin — password DemoPass123! (see README).</p></form></main><footer class="site"></footer><script src="js/app.js"></script><script>
document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault();try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:document.getElementById('lu').value,password:document.getElementById('lp').value})});localStorage.setItem('asiaslleek_token',r.access_token);location.href='index.html';}catch(err){document.getElementById('err').textContent='Sign-in failed: '+err.message}});
</script></body></html>
