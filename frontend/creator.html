<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Creator — AsiaSLleek</title><link rel="stylesheet" href="css/main.css"></head><body><header class="site"></header><main><div id="cp"></div><div id="grid" class="grid"></div></main><footer class="site"></footer><script src="js/app.js"></script><script>
async function main(){const id=new URLSearchParams(location.search).get('id');let c=null;try{c=await api('/api/creators/'+id)}catch(e){c={display_name:'Fictional creator',bio:'',videos:FIXTURES.filter(x=>x.id==id)}}if(!c){document.getElementById('cp').innerHTML='<p>Creator not found.</p>';return}document.title=c.display_name+' — AsiaSLleek';document.getElementById('cp').innerHTML='<h1>'+esc(c.display_name)+'</h1><p>'+esc(c.bio||'')+'</p><p class="muted">Approved creator profile. Only moderator-approved videos are shown.</p>';document.getElementById('grid').innerHTML=(c.videos||[]).map(videoCard).join('')||'<p>No approved videos yet.</p>';}
document.addEventListener('DOMContentLoaded',main);
</script></body></html>
